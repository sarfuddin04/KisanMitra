services:
  # FastAPI Backend
  - type: web
    name: kisanmitra-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PROJECT_NAME
        value: KisanMitra AI
      - key: TAGLINE
        value: Your Intelligent Farming Companion
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kisanmitra-db
          property: connectionString
      - key: OPENWEATHER_API_KEY
        value: ""
      - key: GEMINI_API_KEY
        value: ""
    healthCheckPath: /api/health

  # React Frontend (Static Site)
  - type: web
    name: kisanmitra-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: kisanmitra-db
    databaseName: kisanmitra
    plan: free
